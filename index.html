<html lang="en">

<title>Slate Lab</title>

<style>
:root{
  --ground:#080C09; --surface:#0F1712; --surface-2:#16211A; --surface-3:#1E2C23;
  --rule:#213026; --rule-strong:#375243;
  --ink:#DEEAE1; --ink-2:#A6BCAF; --muted:#748B7E;
  --accent:#35C46E; --accent-ink:#7BE8A5; --accent-soft:#0F2E1D; --accent-rgb:53,196,110;
  --good:#4ADE80; --good-rgb:74,222,128; --warn:#E3A93C; --warn-soft:#2E2410; --bad:#F0716A; --bad-rgb:240,113,106;
  --on-accent:#04150A;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--cond);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#app{max-width:1620px;margin:0 auto;padding:0 14px 60px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 0;border-bottom:1px solid var(--accent)}
.brand{font-family:var(--cond);font-size:28px;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--accent);padding-bottom:10px}
.brand span{color:var(--ink)}
.tagline{color:var(--muted);font-size:13px;padding-bottom:10px}
.grow{flex:1}
#chips{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:10px}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:2px;border:1px solid var(--rule-strong);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.screens{display:flex;gap:4px;align-self:flex-end;flex-wrap:wrap}
.scr{background:none;border:1px solid var(--rule-strong);border-bottom:none;padding:8px 16px;cursor:pointer;font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:14px;font-weight:600;color:var(--muted);border-radius:3px 3px 0 0;display:flex;align-items:center;gap:8px}
.scr .step{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);border-radius:2px;padding:1px 6px;color:var(--muted)}
.scr[aria-selected=true]{background:var(--surface);border-color:var(--accent);color:var(--accent);margin-bottom:-1px}
.scr[aria-selected=true] .step{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:322px minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.rail{position:static;max-height:none}}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:2px}
.phead{font-family:var(--cond);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;color:var(--accent);padding:8px 13px;border-bottom:1px solid var(--rule);background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pbody{padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--ground);border:1px solid var(--rule-strong);border-radius:2px;padding:6px 7px;font-family:var(--mono);font-size:13px;width:100%;color:var(--ink);min-width:0}
select{font-family:var(--sans);font-size:12.5px}
textarea{font-size:11.5px;line-height:1.5;resize:vertical}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:2px;padding:10px 14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule-strong);font-size:11px;padding:4px 9px;width:auto;letter-spacing:.06em}
.btn.ghost:hover{background:var(--surface-2);color:var(--accent);border-color:var(--accent)}
.drop{border:1px dashed var(--rule-strong);background:var(--ground);padding:12px;text-align:center;cursor:pointer;display:block;border-radius:2px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--ink)}
.drop input{display:none}
.hint{color:var(--muted);font-size:11.5px;line-height:1.4}
details summary{cursor:pointer;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted)}
details[open] summary{margin-bottom:8px;color:var(--accent)}
.prog{height:5px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s linear}
.tabs{display:flex;border-bottom:1px solid var(--accent);overflow-x:auto}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:6px 14px;cursor:pointer;font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:14px;font-weight:600;color:var(--muted);border-radius:2px 2px 0 0;white-space:nowrap}
.tab[aria-selected=true]{background:var(--surface);border-color:var(--accent);border-bottom-color:var(--surface);color:var(--accent);margin-bottom:-1px}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}
.tablewrap{overflow:auto;border:1px solid var(--rule);border-top:none;background:var(--surface);max-height:60vh}
.tablewrap.tall{max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;color:var(--ink-2);text-align:left;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--rule-strong);white-space:nowrap;position:sticky;top:0;z-index:3;cursor:pointer;user-select:none}
th.na{cursor:default}
th .ar{color:var(--accent);font-size:9px;margin-left:2px}
td{padding:3px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
tbody tr:hover td{background:var(--surface-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pos{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.tm{font-family:var(--cond);font-weight:600;letter-spacing:.05em;font-size:13px;color:var(--ink)}
.sub{color:var(--muted);font-size:11px;font-family:var(--mono)}
.miss{color:var(--muted);font-family:var(--mono);font-size:11px}
td input.ed{width:66px;text-align:right;padding:2px 5px;font-size:12px;background:var(--surface-2);border-color:var(--rule)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-top:none}
.empty h3{font-size:19px;color:var(--ink-2);margin-bottom:5px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 10px;background:var(--surface);border:1px solid var(--rule);border-top:none}
.foot{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-top:none;background:var(--surface-2)}
.foot div{padding:9px 15px;border-right:1px solid var(--rule)}
.foot div:last-child{border-right:none}
.foot .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--muted)}
.foot .v{font-family:var(--mono);font-size:16px;font-weight:500}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px;padding:12px}
.cell{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--rule);padding:5px 8px;border-radius:2px}
.cell span{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);flex:1}
.sect{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--accent);padding:11px 13px 2px;background:var(--surface)}
@media (max-width:640px){#app{padding:0 8px 40px}.scr{padding:7px 10px;font-size:12.5px}.tagline{display:none}}
</style>
</head>
