<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050b18">
<title>Slate Lab</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap">
<link rel="stylesheet" href="src/app/style.css">
<style>
/* Data Hub additions */
.srcs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;background:#07132b;border-bottom:1px solid var(--line)}
.src{display:flex;align-items:center;gap:8px;background:#0d1d3d;border:1px solid var(--line2);border-radius:4px;padding:6px 10px;font-size:11.5px;color:var(--ink2);min-width:150px}
.src i{width:8px;height:8px;border-radius:50%;background:#3a4a6e;flex:none}
.src.ok i{background:var(--green2)}.src.warn i{background:var(--yellow)}.src.bad i{background:var(--red)}
.src b{color:#fff;font-weight:700}
.src small{display:block;color:var(--muted);font-size:10.5px}
.src .act{margin-left:auto;background:none;border:0;color:var(--blue2);cursor:pointer;font-size:11px;padding:0 2px}
.btn.refresh{background:var(--green);border-color:var(--green)}
.btn.refresh:hover{background:var(--green2);border-color:var(--green2)}
.btn.refresh.busy{opacity:.6;cursor:progress}
.steps{display:flex;flex-wrap:wrap;gap:6px 14px;padding:4px 16px 0;font-size:11px;color:var(--ink2)}
.steps .ok{color:var(--green2)}.steps .bad{color:#ff8a8a}
td.gap{font-weight:700}
.gap.up{color:var(--green2)}.gap.dn{color:#ff8a8a}
.inj{display:inline-block;padding:1px 5px;border-radius:2px;font-size:9.5px;font-weight:700;background:#7f1d1d;color:#fff;margin-left:5px;vertical-align:middle}
.inj.q{background:#8a6d1d}
.mini{font-size:10.5px;color:var(--muted)}
.drop.sm{padding:8px;font-size:11.5px}
.games td{white-space:normal}
.mv{font-size:10.5px;margin-left:4px}
.mv.up{color:var(--green2)}.mv.dn{color:#ff8a8a}
.kpi{display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px}
.kpi .box{background:#0d1d3d;border:1px solid var(--line2);border-radius:4px;padding:8px 12px;min-width:120px}
.kpi .box .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .box .v{font-size:16px;font-weight:700;color:#fff}
/* entries */
.vchip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}
.vchip.g{background:#0d3a22;color:var(--green2)}.vchip.r{background:#4a1414;color:#ff8a8a}.vchip.y{background:#3d3310;color:var(--yellow)}.vchip.m{background:#1e2a44;color:var(--ink2)}
.rules{font-size:11px;line-height:1.5;white-space:normal;min-width:180px;max-width:300px}
.rules .hard{color:#ff8a8a;font-weight:700}.rules .soft{color:var(--yellow)}.rules .none{color:var(--green2);font-weight:700}.rules .unk{color:var(--muted)}
.rules .mini{font-weight:400;color:var(--ink2)}
.rules .rsum{cursor:pointer;user-select:none;white-space:nowrap}
.rules .rsum:hover{text-decoration:underline dotted}
.rules .rdet{margin-top:4px}
.rules .etr{margin-top:4px;padding-top:3px;border-top:1px dashed var(--line2);color:var(--muted);font-weight:700}
.rules .etrmiss{color:#c9b36a;font-weight:400}
textarea.thesis{width:220px;min-height:44px;background:#0f1f3f;border:1px solid var(--line2);border-radius:4px;color:#fff;font:inherit;font-size:11.5px;padding:4px 6px;resize:vertical}
textarea.thesis:placeholder-shown{border-color:#8a6d1d}
.simc{font-size:11px;line-height:1.5;white-space:nowrap}
.simc .up{color:var(--green2)}.simc .dn{color:#ff8a8a}.simc span{margin-right:2px}
.kpi .box table th{background:transparent;color:var(--muted);font-size:9.5px}
@media (max-width:700px){.notesgrid{grid-template-columns:1fr!important}}
@media (max-width:700px){.srcs{padding:6px 10px}.src{min-width:0;flex:1 1 45%}textarea.thesis{width:160px}}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading Slate Lab…<small>Start the hub server: <code>node server/hub.mjs</code> and open http://localhost:8787</small></div></div>
<script type="module" src="src/hub/main.mjs"></script>
</body>
</html>
